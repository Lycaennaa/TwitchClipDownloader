name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (without the v prefix)
        required: true
        type: string
      publish:
        description: Publish now; immutable releases cannot be deleted
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate release version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const expectedTag = `v${manifest.version}`;

          if (manifest.version !== packageJson.version || process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Release tag and extension versions must match: tag=${process.env.RELEASE_TAG}, manifest=${manifest.version}, package=${packageJson.version}`,
            );
          }
          NODE
      - name: Package Chrome extension
        run: |
          set -euo pipefail
          archive=twitch-clip-bulk-downloader-chrome.zip
          zip -r "$archive" manifest.json src -x '*/.DS_Store'
          unzip -t "$archive"
          unzip -Z1 "$archive" > "$RUNNER_TEMP/chrome-extension-files.txt"
          grep -Fxq manifest.json "$RUNNER_TEMP/chrome-extension-files.txt"
      - name: Generate SHA-256 checksums
        run: sha256sum twitch-clip-bulk-downloader-chrome.zip > SHA256SUMS
      - name: Attest release artifact
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: twitch-clip-bulk-downloader-chrome.zip
      - name: Find existing draft release
        id: existing_draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          release_id="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | select(.tag_name == env.RELEASE_TAG and .draft) | .id')"
          printf 'id=%s\n' "$release_id" >> "$GITHUB_OUTPUT"
      - name: Create draft GitHub release
        id: draft_release
        if: steps.existing_draft.outputs.id == ''
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          body: |
            ## Verify release artifacts

            Verify the downloaded ZIP checksum:

            ```sh
            sha256sum --check SHA256SUMS
            ```

            Verify GitHub build provenance when available (requires GitHub CLI):

            ${{ github.event.repository.visibility == 'public' && format('`gh attestation verify twitch-clip-bulk-downloader-chrome.zip --repo {0}`', github.repository) || 'Not generated for this private repository.' }}
          files: |
            twitch-clip-bulk-downloader-chrome.zip
            SHA256SUMS
          fail_on_unmatched_files: true
      - name: Publish immutable release
        if: github.event_name == 'push' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          RELEASE_ID: ${{ steps.existing_draft.outputs.id || steps.draft_release.outputs.id }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_ID" ]]; then
            printf 'No draft release found for %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --field draft=false > /dev/null