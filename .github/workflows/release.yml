name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const expectedTag = `v${manifest.version}`;

          if (manifest.version !== packageJson.version || process.env.RELEASE_TAG !== expectedTag) {
            throw new Error(
              `Release tag and extension versions must match: tag=${process.env.RELEASE_TAG}, manifest=${manifest.version}, package=${packageJson.version}`,
            );
          }
          NODE
      - name: Package extension
        run: zip -r twitch-clip-bulk-downloader.zip manifest.json src -x '*/.DS_Store'
      - name: Generate SHA-256 checksums
        run: sha256sum twitch-clip-bulk-downloader.zip > SHA256SUMS
      - name: Attest release artifact
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: twitch-clip-bulk-downloader.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          generate_release_notes: true
          body: |
            ## Verify release artifacts

            Verify the downloaded ZIP checksum:

            ```sh
            sha256sum --check SHA256SUMS
            ```

            Verify GitHub build provenance (requires GitHub CLI):

            ```sh
            gh attestation verify twitch-clip-bulk-downloader.zip --repo ${{ github.repository }}
            ```
          files: |
            twitch-clip-bulk-downloader.zip
            SHA256SUMS
          fail_on_unmatched_files: true